name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-scraper.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg nginx libnginx-mod-http-lua lua-cjson
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s cinema/tests -v
      - run: python -m unittest discover -s emby_bridge/tests -v
  cinema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cinema/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
        env:
          CINEMA_PUBLIC_DIR: ../examples/cinema
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
