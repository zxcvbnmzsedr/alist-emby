# Dedicated media host: all existing AList routes keep their original proxy settings.
server {
    listen 80;
    listen 443 ssl;
    server_name media.example.com;
    set $service_backend "127.0.0.1:5244";
    ssl_certificate /etc/nginx/tls/media.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/media.example.com.key;

    location = /_cinema_identity {
        internal;
        proxy_pass http://$service_backend/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $cinema_token;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache off;
    }
    location = /cinema/session {
        set $cinema_token "";
        content_by_lua_file /etc/nginx/conf.d/cinema-auth.lua;
    }
    location = /cinema/api/fs/get {
        set $cinema_token "";
        access_by_lua_file /etc/nginx/conf.d/cinema-auth.lua;
        proxy_pass http://$service_backend/api/fs/get;
        proxy_set_header Authorization $cinema_token;
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    location = /cinema {
        absolute_redirect off;
        return 302 /cinema/;
    }
    # Public application shell contains only the login UI; data stays private.
    location = /cinema/ {
        root /srv/alist-emby/www;
        try_files /cinema/index.html =404;
        add_header Cache-Control "no-store" always;
    }
    location = /cinema/index.html {
        root /srv/alist-emby/www;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /cinema/assets/ {
        root /srv/alist-emby/www;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /cinema/ {
        set $cinema_token "";
        access_by_lua_file /etc/nginx/conf.d/cinema-auth.lua;
        root /srv/alist-emby/www;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "private, no-store" always;
    }
    # Fileball / Emby client compatibility service.
    location = /emby {
        absolute_redirect off;
        return 302 /emby/;
    }
    location ^~ /emby/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
        access_log off;
    }
    location ~* ^/(System|Users|Items|Sessions|Library|Shows|Videos|DisplayPreferences|Branding|Channels|Plugins|ScheduledTasks|Movies|LiveTv)(/|$) {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
        access_log off;
    }
    location = /web/manifest.json {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $http_host;
        proxy_cache off;
        access_log off;
    }
    location / {
        proxy_pass http://$service_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Accept-Language "zh-CN";
        add_header X-Accel-Buffering no always;
    }
}
